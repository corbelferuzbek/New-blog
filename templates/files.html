<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Fayllar ro'yxati</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Yuklangan fayllar</h1>
        <p><a href="{{ url_for('index') }}">&larr; Bosh sahifaga qaytish</a></p>

        {% if files %}
            <table class="file-table">
                <thead>
                    <tr>
                        <th>Fayl nomi</th>
                        <th>Hajmi / Sana</th>
                        <th>Amal</th>
                    </tr>
                </thead>
                <tbody>
                    {% for file in files %}
                    <tr>
                        <td>{{ file.name }}</td>
                        <td>{{ file.date }}</td>
                        <td>
                            <!-- Oddiy userlar ham ko'rishi va yuklab olishi mumkin -->
                            <a href="{{ url_for('download_file', filename=file.name) }}" class="btn-download">Yuklab olish</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>Hozircha fayllar mavjud emas.</p>
        {% endif %}
    </div>
</body>
</html>
